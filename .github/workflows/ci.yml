name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SWIFT_SNAPSHOT: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a
  SWIFT_COMPILER_COMMIT: ef761e567dc94ee
  TOOLCHAINS: org.swift.64202607231a

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Swift toolchain
        run: |
          set -euo pipefail
          toolchain="$HOME/Library/Developer/Toolchains/${SWIFT_SNAPSHOT}.xctoolchain"
          if [[ ! -d "$toolchain" ]]; then
            package="$RUNNER_TEMP/${SWIFT_SNAPSHOT}-osx.pkg"
            curl -fsSL --retry 3 \
              "https://download.swift.org/swift-6.4.x-branch/xcode/${SWIFT_SNAPSHOT}/${SWIFT_SNAPSHOT}-osx.pkg" \
              -o "$package"
            installer -pkg "$package" -target CurrentUserHomeDirectory
          fi
          xcode_ld="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin/ld"
          test -x "$xcode_ld"
          ln -sfn "$xcode_ld" "$toolchain/usr/bin/ld"
          xcrun swiftc --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -F "Swift ${SWIFT_COMPILER_COMMIT}" "$RUNNER_TEMP/swift-version.txt"

      - name: Build tests with Xcode
        run: |
          python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=int(sys.argv[1])).returncode)' \
            120 xcodebuild build-for-testing \
              -toolchain "$TOOLCHAINS" \
              -scheme swift-nio-udp \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO \
              "LD_RUNPATH_SEARCH_PATHS=\$(inherited) $HOME/Library/Developer/Toolchains/${SWIFT_SNAPSHOT}.xctoolchain/usr/lib/swift/macosx/testing"

      - name: Run tests with Xcode
        run: |
          python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=int(sys.argv[1])).returncode)' \
            120 xcodebuild test-without-building \
              -toolchain "$TOOLCHAINS" \
              -scheme swift-nio-udp \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              CODE_SIGNING_ALLOWED=NO \
              "LD_RUNPATH_SEARCH_PATHS=\$(inherited) $HOME/Library/Developer/Toolchains/${SWIFT_SNAPSHOT}.xctoolchain/usr/lib/swift/macosx/testing"
